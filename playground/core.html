<html>
<head>
	<meta charset="UTF-8">
	<title>startDrag Playground</title>
	<style type="text/css">
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: monospace;
			padding: 20px;
		}

		#controls {
			display: flex;
			gap: 16px;
			align-items: center;
			margin-bottom: 20px;
		}

		#stage {
			position: relative;
			height: 300px;
			background-color: #c9c9c9;
			touch-action: none;
		}

		#box {
			position: absolute;
			left: 50px;
			top: 50px;
			width: 120px;
			height: 120px;
			background-color: #6850d4;
			color: white;
			display: flex;
			justify-content: center;
			align-items: center;
			user-select: none;
		}

		#log {
			margin-top: 20px;
			height: 240px;
			overflow: auto;
			white-space: pre;
			background-color: #f3f3f3;
			padding: 8px;
		}
	</style>
</head>
<body>
	<div id="controls">
		<a href="./playground.html">Draggables playground</a>
		<a href="./drag.html">drag() playground</a>
		<label>threshold <input id="threshold" type="number" value="3" min="0" style="width: 60px" /></label>
		<button id="clear-log">Clear log</button>
		<span>Esc cancels</span>
		<span id="status">idle</span>
	</div>
	<div id="stage">
		<div id="box">drag me</div>
	</div>
	<div id="log"></div>

	<script type="module" src="./core.ts"></script>
</body>
</html>
