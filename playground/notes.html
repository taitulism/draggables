<html>
<head>
	<meta charset="UTF-8">
	<title>notes — createDragger() Playground</title>
	<link rel="stylesheet" href="./shared.css" />
	<style type="text/css">
		.note {
			position: absolute;
			width: 110px;
			height: 90px;
			padding: 6px;
			background-color: #ffe066;
			border: 1px solid #999;
			box-shadow: 0 2px 6px #0003;
		}

		.note:nth-child(2) { background-color: #ff9a6b }
		.note:nth-child(3) { background-color: #74c0fc }
		.note.locked { opacity: 0.5 }

		.note { z-index: 1 }

		.trash {
			position: absolute;
			right: 20px;
			bottom: 20px;
			width: 120px;
			height: 100px;
			display: grid;
			place-items: center;
			border: 2px dashed #a33;
			color: #a33;
		}

		.trash.over { background-color: #e88 }

		#board { border: 4px solid transparent }
		#board.near-top { border-top-color: #e33 }
		#board.near-right { border-right-color: #e33 }
		#board.near-bottom { border-bottom-color: #e33 }
		#board.near-left { border-left-color: #e33 }

		.grip {
			width: 100%;
			height: 20px;
			background-color: #0003;
			cursor: grab;
		}
	</style>
</head>
<body>
	<nav id="nav"></nav>
	<div id="controls">
		<label>clamp
			<select id="bound">
				<option value="element">element</option>
				<option value="pointer">pointer</option>
			</select>
		</label>
	</div>
	<div id="board" class="stage">
		<div class="note" data-name="note A" style="left: 20px; top: 20px">note A</div>
		<div class="note" data-name="note B" style="left: 160px; top: 40px">note B</div>
		<div class="note" data-name="note C" style="left: 300px; top: 60px">note C</div>
		<div class="note" data-name="grip only" style="left: 440px; top: 80px">
			<div class="grip"></div>
			grip only
		</div>
		<div class="note locked" data-name="disabled" style="left: 580px; top: 100px">disabled</div>
		<div class="trash">trash</div>
	</div>
	<div id="tboard" class="stage" style="margin-top: 16px">
		<div class="note" data-name="translate A" style="left: 20px; top: 20px">translate A</div>
		<div class="note" data-name="translate B" style="left: 160px; top: 40px">translate B</div>
	</div>
	<aside id="log-panel">
		<button id="clear-log">Clear log</button>
		<div id="log"></div>
	</aside>

	<script type="module" src="./notes.ts"></script>
</body>
</html>
