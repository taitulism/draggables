<html>
<head>
	<meta charset="UTF-8">
	<title>viewport-pan — createDragger() Playground</title>
	<link rel="stylesheet" href="./shared.css" />
	<style type="text/css">
		#viewport {
			overflow: hidden;
			cursor: grab;
		}

		#viewport.panning {
			cursor: grabbing;
		}

		#content {
			display: grid;
			grid-template-columns: repeat(20, 120px);
			gap: 8px;
			padding: 8px;
			width: max-content;
		}

		.tile {
			height: 120px;
			background-color: #ffe066;
			border: 1px solid #999;
			box-shadow: 0 2px 6px #0003;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.tile:nth-child(3n) { background-color: #ff9a6b }
		.tile:nth-child(3n + 1) { background-color: #74c0fc }
	</style>
</head>
<body>
	<nav id="nav"></nav>
	<div id="controls">
	</div>
	<div id="viewport" class="stage">
		<div id="content"></div>
	</div>
	<aside id="log-panel">
		<button id="clear-log">Clear log</button>
		<div id="log"></div>
	</aside>

	<script type="module" src="./viewport-pan.ts"></script>
</body>
</html>
