<html>
<head>
	<meta charset="UTF-8">
	<title>resize — drag() Playground</title>
	<link rel="stylesheet" href="./shared.css" />
	<style type="text/css">
		#panel {
			position: absolute;
			left: 100px;
			top: 60px;
			width: 200px;
			height: 120px;
			background-color: #6850d4;
			color: white;
			padding: 12px;
		}

		.handle {
			position: absolute;
			width: 12px;
			height: 12px;
			background-color: white;
			border: 1px solid #333;
			touch-action: none;
		}

		[data-edge="n"], [data-edge="s"] { left: calc(50% - 6px); cursor: ns-resize }
		[data-edge="e"], [data-edge="w"] { top: calc(50% - 6px); cursor: ew-resize }
		[data-edge^="n"] { top: -6px }
		[data-edge^="s"] { bottom: -6px }
		[data-edge$="e"] { right: -6px }
		[data-edge$="w"] { left: -6px }
		[data-edge="nw"], [data-edge="se"] { cursor: nwse-resize }
		[data-edge="ne"], [data-edge="sw"] { cursor: nesw-resize }
	</style>
</head>
<body>
	<nav id="nav"></nav>
	<div id="controls">
		<label>threshold <input id="threshold" type="number" value="3" min="0" style="width: 60px" /></label>
		<button id="clear-log">Clear log</button>
	</div>
	<div class="stage">
		<div id="panel">
			resize me
			<div class="handle" data-edge="n" data-name="n"></div>
			<div class="handle" data-edge="s" data-name="s"></div>
			<div class="handle" data-edge="e" data-name="e"></div>
			<div class="handle" data-edge="w" data-name="w"></div>
			<div class="handle" data-edge="ne" data-name="ne"></div>
			<div class="handle" data-edge="nw" data-name="nw"></div>
			<div class="handle" data-edge="se" data-name="se"></div>
			<div class="handle" data-edge="sw" data-name="sw"></div>
		</div>
	</div>
	<div id="log"></div>

	<script type="module" src="./resize.ts"></script>
</body>
</html>
