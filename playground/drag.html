<html>
<head>
	<meta charset="UTF-8">
	<title>drag() Playground</title>
	<style type="text/css">
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: monospace;
			padding: 20px;
		}

		#controls {
			display: flex;
			gap: 16px;
			align-items: center;
			margin-bottom: 20px;
		}

		#board {
			position: relative;
			height: 300px;
			background-color: #c9c9c9;
			touch-action: none;
		}

		.note {
			position: absolute;
			width: 110px;
			height: 90px;
			padding: 6px;
			background-color: #f5d76e;
		}

		.note:nth-child(2) { background-color: #9fd8a0 }
		.note:nth-child(3) { background-color: #8fc1ec }
		.note[data-drag-disabled] { opacity: 0.5 }

		.grip {
			width: 100%;
			height: 20px;
			background-color: #0003;
			cursor: grab;
		}

		#panel {
			position: relative;
			width: 200px;
			height: 120px;
			margin-top: 20px;
			background-color: #6850d4;
			color: white;
			padding: 6px;
		}

		#handle {
			position: absolute;
			right: 0;
			bottom: 0;
			width: 16px;
			height: 16px;
			background-color: white;
			cursor: nwse-resize;
			touch-action: none;
		}

		#log {
			margin-top: 20px;
			height: 200px;
			overflow: auto;
			white-space: pre;
			background-color: #f3f3f3;
			padding: 8px;
		}
	</style>
</head>
<body>
	<div id="controls">
		<a href="./core.html">startDrag playground</a>
		<label>threshold <input id="threshold" type="number" value="3" min="0" style="width: 60px" /></label>
		<button id="clear-log">Clear log</button>
	</div>
	<div id="board">
		<div class="note" data-drag-role="draggable" style="left: 20px; top: 20px">note A</div>
		<div class="note" data-drag-role="draggable" style="left: 160px; top: 40px">note B</div>
		<div class="note" data-drag-role="draggable" style="left: 300px; top: 60px">note C</div>
		<div class="note" data-drag-role="draggable" style="left: 440px; top: 80px">
			<div class="grip" data-drag-role="grip"></div>
			grip only
		</div>
		<div class="note" data-drag-role="draggable" data-drag-disabled style="left: 580px; top: 100px">disabled</div>
	</div>
	<div id="panel">
		resize me
		<div id="handle" data-drag-role="draggable"></div>
	</div>
	<div id="log"></div>

	<script type="module" src="./drag.ts"></script>
</body>
</html>
